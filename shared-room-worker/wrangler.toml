name = "puffer-share"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[triggers]
# 03:00 China Standard Time (UTC+8): conservative daily cleanup of only
# registered, unreferenced media that has passed the 30-day grace period.
crons = ["0 19 * * *"]

[ai]
binding = "AI"

routes = [
  { pattern = "sync.20051011.xyz/*", zone_name = "20051011.xyz" }
]

[[kv_namespaces]]
binding = "BENCH"
id = "773e10e804bb4c0d9c9b24273b37e258"

[[d1_databases]]
binding = "DB"
database_name = "pufferwork-db"
database_id = "00a045d4-22f1-4905-a426-9bcaca9d0fae"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pufferwork-media-private"
